<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>The First Jasmine / Mo Li</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#0b0b0b;
      color:white;
      overflow-x:hidden;
    }

    .topbar{
      width:100%;
      padding:18px 20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      position:sticky;
      top:0;
      background:#0b0b0be6;
      backdrop-filter:blur(10px);
      border-bottom:1px solid #1e1e1e;
    }

    .title{
      font-size:18px;
      font-weight:700;
      color:#00ff88;
    }

    .welcome{
      font-size:18px;
      font-weight:700;
      color:white;
    }

    .container{
      width:100%;
      max-width:1200px;
      margin:auto;
      padding:18px;
    }

    .video-box{
      width:100%;
      border-radius:22px;
      overflow:hidden;
      background:black;
      aspect-ratio:16/9;
    }

    .video-box iframe{
      width:100%;
      height:100%;
      border:none;
    }

    .episode-title{
      margin-top:18px;
      font-size:28px;
      font-weight:bold;
    }

    .episode-header{
      margin-top:30px;
      margin-bottom:16px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .episode-count{
      color:#00ff88;
      font-size:15px;
      font-weight:600;
    }

    .episode-list{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(90px, 1fr));
      gap:12px;
    }

    .episode-btn{
      border:none;
      background:#191919;
      color:white;
      padding:16px 0;
      border-radius:16px;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
    }

    .episode-btn.active{
      background:#00ff88;
      color:black;
    }

    @media (max-width:600px){
      .title,.welcome{
        font-size:14px;
      }

      .episode-list{
        grid-template-columns:repeat(3,1fr);
      }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="title">The First Jasmine / Mo Li</div>
    <div class="welcome">Welcome CEO :)</div>
  </div>

  <div class="container">

    <div class="video-box">
      <iframe id="player"
      src="https://krakenfiles.com/embed-video/LipUAwmfFM"
      allowfullscreen></iframe>
    </div>

    <div class="episode-title" id="episodeTitle">
      Episode 6
    </div>

    <div class="episode-header">
      <h3>Episodes</h3>
      <div class="episode-count">6 - 13</div>
    </div>

    <div class="episode-list">

      <button class="episode-btn active" onclick="setEpisode(6,'https://krakenfiles.com/embed-video/LipUAwmfFM',this)">EP 6</button>
      <button class="episode-btn" onclick="setEpisode(7,'https://krakenfiles.com/embed-video/v8O5AGUUBn',this)">EP 7</button>
      <button class="episode-btn" onclick="setEpisode(8,'https://krakenfiles.com/embed-video/W6vQ2ekCFs',this)">EP 8</button>
      <button class="episode-btn" onclick="setEpisode(9,'https://krakenfiles.com/embed-video/W4rUVjFxMD',this)">EP 9</button>
      <button class="episode-btn" onclick="setEpisode(10,'https://krakenfiles.com/embed-video/JfjNJy3oY9',this)">EP 10</button>
      <button class="episode-btn" onclick="setEpisode(11,'https://krakenfiles.com/embed-video/AjDw23S6zW',this)">EP 11</button>
      <button class="episode-btn" onclick="setEpisode(12,'https://krakenfiles.com/embed-video/rYBPEGmMtv',this)">EP 12</button>
      <button class="episode-btn" onclick="setEpisode(13,'https://krakenfiles.com/embed-video/cOtk7T27Ue',this)">EP 13</button>

    </div>

  </div>

  <script>
    function setEpisode(ep, url, button){
      document.getElementById("player").src = url;
      document.getElementById("episodeTitle").innerText = "Episode " + ep;

      document.querySelectorAll(".episode-btn").forEach(btn=>{
        btn.classList.remove("active");
      });

      button.classList.add("active");

      window.scrollTo({
        top:0,
        behavior:"smooth"
      });
    }
  </script>

</body>
</html>
