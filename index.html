<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>A Splendid Match</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#0b0b0b;
      color:white;
      overflow-x:hidden;
    }

    .topbar{
      width:100%;
      padding:18px 20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      position:sticky;
      top:0;
      z-index:100;
      background:#0b0b0be6;
      backdrop-filter:blur(10px);
      border-bottom:1px solid #1e1e1e;
    }

    .title{
      font-size:24px;
      font-weight:700;
      color:#00ff88;
      letter-spacing:1px;
      text-transform:uppercase;
    }

    .search{
      width:44px;
      height:44px;
      border-radius:14px;
      background:#181818;
      display:flex;
      justify-content:center;
      align-items:center;
      font-size:18px;
    }

    .container{
      width:100%;
      max-width:1200px;
      margin:auto;
      padding:18px;
    }

    .video-box{
      width:100%;
      border-radius:22px;
      overflow:hidden;
      background:black;
      box-shadow:0 12px 35px rgba(0,0,0,0.45);
      aspect-ratio:16/9;
    }

    .video-box iframe{
      width:100%;
      height:100%;
      border:none;
    }

    .episode-title{
      margin-top:18px;
      font-size:28px;
      font-weight:bold;
    }

    .episode-header{
      margin-top:30px;
      margin-bottom:16px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .episode-header h3{
      font-size:22px;
    }

    .episode-count{
      color:#00ff88;
      font-size:15px;
      font-weight:600;
    }

    .episode-list{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(90px, 1fr));
      gap:12px;
    }

    .episode-btn{
      border:none;
      background:#191919;
      color:white;
      padding:16px 0;
      border-radius:16px;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
      transition:0.2s ease;
    }

    .episode-btn:hover{
      background:#272727;
      transform:scale(1.03);
    }

    .episode-btn.active{
      background:#00ff88;
      color:black;
    }

    .bottom-space{
      height:40px;
    }

    /* Phones */
    @media (max-width:600px){

      .container{
        padding:14px;
      }

      .title{
        font-size:18px;
      }

      .episode-title{
        font-size:22px;
      }

      .episode-header h3{
        font-size:18px;
      }

      .episode-list{
        grid-template-columns:repeat(3,1fr);
      }

      .episode-btn{
        padding:14px 0;
        font-size:15px;
        border-radius:14px;
      }

      .video-box{
        border-radius:18px;
      }

    }

    /* iPads / Tablets */
    @media (min-width:601px) and (max-width:1024px){

      .container{
        padding:24px;
      }

      .episode-list{
        grid-template-columns:repeat(5,1fr);
      }

      .episode-btn{
        padding:18px 0;
        font-size:17px;
      }

      .episode-title{
        font-size:30px;
      }

    }

    /* Large screens */
    @media (min-width:1025px){

      .episode-list{
        grid-template-columns:repeat(6,1fr);
      }

    }

  </style>
</head>
<body>

  <div class="topbar">
    <div class="title">A SPLENDID MATCH</div>
    <div class="search">🔍</div>
  </div>

  <div class="container">

    <div class="video-box">
      <iframe
        id="player"
        src="https://krakenfiles.com/embed-video/ARW7sOVWb9"
        allowfullscreen>
      </iframe>
    </div>

    <div class="episode-title" id="episodeTitle">
      Episode 24
    </div>

    <div class="episode-header">
      <h3>Episodes</h3>
      <div class="episode-count">24 - 36</div>
    </div>

    <div class="episode-list">

      <button class="episode-btn active"
      onclick="setEpisode(24,'https://krakenfiles.com/embed-video/ARW7sOVWb9',this)">
      EP 24
      </button>

      <button class="episode-btn"
      onclick="setEpisode(25,'https://krakenfiles.com/embed-video/jtdqdLSV21',this)">
      EP 25
      </button>

      <button class="episode-btn"
      onclick="setEpisode(26,'https://krakenfiles.com/embed-video/kVRVlt0FWN',this)">
      EP 26
      </button>

      <button class="episode-btn"
      onclick="setEpisode(27,'https://krakenfiles.com/embed-video/bnJ1Fc3HIo',this)">
      EP 27
      </button>

      <button class="episode-btn"
      onclick="setEpisode(28,'https://krakenfiles.com/embed-video/HOqYzXcORz',this)">
      EP 28
      </button>

      <button class="episode-btn"
      onclick="setEpisode(29,'https://krakenfiles.com/embed-video/9VZEUlzLTx',this)">
      EP 29
      </button>

      <button class="episode-btn"
      onclick="setEpisode(30,'https://krakenfiles.com/embed-video/2XRiIevzbl',this)">
      EP 30
      </button>

      <button class="episode-btn"
      onclick="setEpisode(31,'https://krakenfiles.com/embed-video/9AtcINsFa1',this)">
      EP 31
      </button>

      <button class="episode-btn"
      onclick="setEpisode(32,'https://krakenfiles.com/embed-video/dMm8uLJsPy',this)">
      EP 32
      </button>

      <button class="episode-btn"
      onclick="setEpisode(33,'https://krakenfiles.com/embed-video/yWLHqN9YUh',this)">
      EP 33
      </button>

      <button class="episode-btn"
      onclick="setEpisode(34,'https://krakenfiles.com/embed-video/4VYluyJWRy',this)">
      EP 34
      </button>

      <button class="episode-btn"
      onclick="setEpisode(35,'https://krakenfiles.com/embed-video/lNfVrdU3wr',this)">
      EP 35
      </button>

      <button class="episode-btn"
      onclick="setEpisode(36,'https://krakenfiles.com/embed-video/9AHFwS0JEk',this)">
      EP 36
      </button>

    </div>

    <div class="bottom-space"></div>

  </div>

  <script>

    function setEpisode(ep, url, button){

      document.getElementById("player").src = url;

      document.getElementById("episodeTitle").innerText =
      "Episode " + ep;

      document.querySelectorAll(".episode-btn")
      .forEach(btn => {
        btn.classList.remove("active");
      });

      button.classList.add("active");

      window.scrollTo({
        top:0,
        behavior:"smooth"
      });

    }

  </script>

</body>
</html>
